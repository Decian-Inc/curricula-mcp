[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "curricula-mcp"
version = "0.1.0"
description = "MCP server for the Huntress Curricula public API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Decian, Inc." }]
dependencies = ["mcp>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
curricula-mcp = "curricula_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/curricula_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
